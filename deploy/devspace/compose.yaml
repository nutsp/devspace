name: devspace

x-app-env: &app-env
  WEB_URL: ${WEB_URL:?Set WEB_URL}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
  DEBUG: "0"
  GUNICORN_WORKERS: "1"
  SECRET_KEY: ${SECRET_KEY:?Run configure.py first}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?Run configure.py first}
  DATABASE_URL: postgresql://${POSTGRES_USER:-devspace}:${POSTGRES_PASSWORD:?Run configure.py first}@plane-db:5432/${POSTGRES_DB:-devspace}
  REDIS_URL: redis://plane-redis:6379/
  REDIS_HOST: plane-redis
  REDIS_PORT: "6379"
  AMQP_URL: amqp://${RABBITMQ_USER:-devspace}:${RABBITMQ_PASSWORD:?Run configure.py first}@plane-mq:5672/${RABBITMQ_VHOST:-devspace}
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-devspace}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run configure.py first}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-devspace}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-devspace}
  USE_MINIO: "1"
  MINIO_ENDPOINT_SSL: "0"
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-devspace-storage}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Run configure.py first}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}

x-api: &api
  image: devspace-api:local
  build:
    context: ../..
    dockerfile: Dockerfile.wiki-api
  environment: *app-env
  restart: unless-stopped
  depends_on:
    plane-db: {condition: service_healthy}
    plane-redis: {condition: service_healthy}
    plane-mq: {condition: service_healthy}

services:
  web:
    image: devspace-web:local
    build:
      context: ../..
      dockerfile: deploy/devspace/Dockerfile
      target: web
      args:
        VITE_WEB_BASE_URL: ${WEB_URL:?Set WEB_URL}
    restart: unless-stopped
  admin:
    image: devspace-admin:local
    build:
      context: ../..
      dockerfile: deploy/devspace/Dockerfile
      target: admin
      args:
        VITE_WEB_BASE_URL: ${WEB_URL:?Set WEB_URL}
    restart: unless-stopped
  space:
    image: makeplane/plane-space:v1.4.3
    restart: unless-stopped
  live:
    image: devspace-live:local
    build:
      context: ../..
      dockerfile: deploy/devspace/Dockerfile
      target: live
    environment:
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?Run configure.py first}
      REDIS_URL: redis://plane-redis:6379/
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
    restart: unless-stopped
    depends_on: [api, plane-redis]
  api:
    <<: *api
    command: ./bin/docker-entrypoint-api.sh
    networks: [default, diagrams]
    depends_on:
      plane-db: {condition: service_healthy}
      plane-redis: {condition: service_healthy}
      plane-mq: {condition: service_healthy}
      migrator: {condition: service_completed_successfully}
      plane-minio: {condition: service_started}
  worker:
    <<: *api
    command: ./bin/docker-entrypoint-worker.sh
    depends_on:
      api: {condition: service_started}
  beat-worker:
    <<: *api
    command: ./bin/docker-entrypoint-beat.sh
    depends_on:
      api: {condition: service_started}
  migrator:
    <<: *api
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"
  plane-db:
    image: postgres:15.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devspace}
      POSTGRES_DB: ${POSTGRES_DB:-devspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure.py first}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-devspace}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run configure.py first}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-devspace}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-devspace-storage}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Run configure.py first}
    volumes: [uploads:/export]
    restart: unless-stopped
  proxy:
    image: makeplane/plane-proxy:v1.4.3
    environment:
      SITE_ADDRESS: ":80"
      LISTEN_HTTP_PORT: "80"
      LISTEN_HTTPS_PORT: "443"
      BUCKET_NAME: uploads
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
    ports: ["${DEVSPACE_BIND:-127.0.0.1}:${DEVSPACE_PORT:-8089}:80"]
    volumes: [proxy_config:/config, proxy_data:/data]
    depends_on: [web, admin, space, live, api, plane-minio]
    restart: unless-stopped
  plantuml:
    image: plantuml/plantuml-server@sha256:065c66adc6728ba6dd353a29d4ada73f8358b68549a0f710c4bf46b43c103618
    environment:
      PLANTUML_SECURITY_PROFILE: SANDBOX
      JAVA_OPTIONS: -Xmx384m -DPLANTUML_LIMIT_SIZE=4096
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    networks: [diagrams]
    restart: unless-stopped
  backup:
    profiles: [maintenance]
    image: alpine:3.21
    entrypoint: [tar, -C, /data, -czf, '-', .]
    volumes: [uploads:/data:ro]
  mcp:
    profiles: [mcp]
    build:
      context: ../../integrations/mcp
    image: devspace-mcp:local
    env_file:
      - path: ../../integrations/mcp/mcp.env
        required: false
    environment:
      DEVSPACE_API_URL: http://api:8000
    stdin_open: true
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  diagrams: {internal: true}
volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  uploads:
  proxy_config:
  proxy_data:
